info:
  name: Health Check
  type: http
  seq: 2

http:
  method: GET
  url: "{{HOST}}:{{PORT}}/api/health"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
